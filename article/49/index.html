<blockquote>
<p>2026/07/30 夏 天气雨</p>
</blockquote>
<p>下着大雨，从地铁站走到公司，鞋全湿了，在公司楼下的京东便利店寻找凉鞋和洞洞鞋，但尺码太小，最后只好买了双拖鞋，换上鞋子，穿着拖鞋走进公司，实在没招了😨😨😨</p>
<p>还好只是实习，实习也快结束了，预计下下周离职🥰🥰🥰</p>
<p>夏天到还好，穿凉鞋或者洞洞鞋基本没问题，但冬天下雨，估计得准备雨天鞋套了</p>
